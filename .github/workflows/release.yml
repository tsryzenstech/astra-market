# Builds Market with the astraOS SDK (design check included) and publishes it as
# a GitHub release on every change of the app or of config.json. Market is a
# system app: astra's "apps" workflow publishes it on Market (astra cloud), from
# astra's copy (tools/market/update.py brings this repository's into it), with
# the version the system image gives it; this one does not, so that the two
# version numbers never meet.
name: release
on:
  push:
    branches: [main]
    paths: ["app/**", "config.json", "tools/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  market:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tsryzenstech/astra
          path: astra
          sparse-checkout: tools/apkgtool
      - name: Build
        run: python3 tools/build.py --astra astra --build-number ${{ github.run_number }}
      # The built app is also an artifact of the workflow run.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
      - name: Read version
        id: v
        run: echo "version=$(python3 -c 'import json;print(json.load(open("dist/release.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Market ${{ steps.v.outputs.version }}
          files: |
            dist/com.astra.market.apkg
            dist/release.json
